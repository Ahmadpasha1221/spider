<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:;">

  <title>Spider</title>
  <link rel="stylesheet" href="{{styleUri}}">
</head>

<body>
  <div id="app">

    <header class="app-header">
      <button id="brand-btn" class="brand" type="button" aria-label="Open Spider agent editor" title="Open Spider agent">
        <img class="brand-logo" src="{{logoUri}}" alt="Spider logo">
        <span class="brand-name">Spider</span>
      </button>

      <div id="runtime-pill" class="runtime-pill">
        Cursor
      </div>

      <button id="session-btn" class="session-btn" type="button" title="Switch conversation" aria-haspopup="listbox" aria-expanded="false">
        <span id="session-btn-title">New conversation</span>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </button>

      <div id="session-menu" class="session-menu" role="listbox" hidden></div>

      <div id="checkpoints-menu" class="session-menu checkpoints-menu" role="listbox" hidden></div>

      <div class="header-actions">

        <button id="checkpoints-btn" class="icon-btn" type="button" aria-label="Workspace checkpoints" title="Checkpoints" aria-haspopup="listbox" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.6"/><path d="M3 2.5V5h2.5"/></svg>
        </button>

        <button id="history-btn" class="icon-btn" type="button" aria-label="Open conversation history" title="History">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.3 1.6"/></svg>
        </button>

        <button id="new-session-btn" class="icon-btn icon-btn-plus" type="button" aria-label="Start a new conversation"
          title="New conversation">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        </button>

        <button id="settings-btn" class="icon-btn" type="button" aria-label="Open Spider settings" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.7M8 12.5v1.7M1.8 8h1.7M12.5 8h1.7M3.6 3.6l1.2 1.2M11.2 11.2l1.2 1.2M12.4 3.6l-1.2 1.2M4.8 11.2l-1.2 1.2"/></svg>
        </button>

      </div>
    </header>

    <main id="chat-view" class="view">
      <div id="setup-banner" class="setup-banner" hidden></div>

      <div id="task-plan-root" class="task-plan-root" hidden></div>

      <div id="message-list" class="message-list"></div>

      <div id="composer" class="composer"></div>
    </main>

    <section id="settings-view" class="view settings-view" hidden>

      <div class="settings-heading">
        <div>
          <h1>Settings</h1>
          <p class="hint">
            Choose how Spider runs your coding agent.
          </p>
        </div>

        <button id="settings-back" class="btn btn-ghost" type="button">
          Back to chat
        </button>
      </div>

      <div id="provider-settings"></div>

      <p id="auth-feedback" class="feedback" hidden></p>

    </section>

  </div>  <script nonce="{{nonce}}" src="{{scriptUri}}" data-spider-logo="{{logoUri}}"></script>
  <meta name="spider-logo" content="{{logoUri}}">
  <meta name="spider-show-settings" content="{{showSettings}}">
</body>

</html>
